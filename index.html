<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CombiFile</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #111111;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app {
            width: 480px;
            background: #111111;
            padding: 14px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        button {
            flex: 1;
            height: 32px;
            background: #222222;
            color: #e0e0e0;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover {
            background: #2e2e2e;
        }

        .btn-secondary {
            color: #777777;
        }

        .btn-merge {
            width: 100%;
            flex: none;
            margin-top: 10px;
        }

        .file-list {
            width: 100%;
            height: 200px;
            background: #1a1a1a;
            color: #777777;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 8px 10px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 12px;
            overflow-y: auto;
            margin-bottom: 10px;
            resize: none;
        }

        .file-list:empty::before {
            content: "No files selected";
            color: #444444;
        }

        .field-label {
            font-size: 11px;
            color: #777777;
            margin-bottom: 2px;
            padding-left: 2px;
        }

        .filename-input {
            width: 100%;
            height: 32px;
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 0 10px;
            font-size: 13px;
            outline: none;
        }

        .filename-input:focus {
            border-color: #3a3a3a;
        }

        .status {
            font-size: 11px;
            color: #777777;
            margin-top: 6px;
            padding-left: 2px;
            height: 16px;
        }

        /* hide the native file input */
        #file-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="btn-row">
            <button id="btn-select" type="button">Select Files</button>
            <button id="btn-clear" type="button" class="btn-secondary">Clear List</button>
        </div>

        <div class="file-list" id="file-list"></div>

        <div class="field-label">Output filename</div>
        <input
            type="text"
            class="filename-input"
            id="filename-input"
            value="combined_output.txt"
            spellcheck="false"
        />

        <button id="btn-merge" type="button" class="btn-merge">Merge</button>

        <div class="status" id="status">Ready</div>

        <input type="file" id="file-input" multiple />
    </div>

    <script>
        const fileInput   = document.getElementById("file-input");
        const fileListEl  = document.getElementById("file-list");
        const filenameIn  = document.getElementById("filename-input");
        const statusEl    = document.getElementById("status");
        const btnSelect   = document.getElementById("btn-select");
        const btnClear    = document.getElementById("btn-clear");
        const btnMerge    = document.getElementById("btn-merge");

        /** @type {File[]} */
        let selectedFiles = [];
        let resetTimer    = null;

        // ── helpers ──────────────────────────────────────────────────
        function setStatus(text, autoReset = false) {
            statusEl.textContent = text;
            if (resetTimer) clearTimeout(resetTimer);
            if (autoReset) {
                resetTimer = setTimeout(() => { statusEl.textContent = "Ready"; }, 3000);
            }
        }

        function refreshList() {
            fileListEl.textContent = "";
            selectedFiles.forEach(f => {
                const line = document.createElement("div");
                line.textContent = f.name;
                fileListEl.appendChild(line);
            });
        }

        // ── select files ─────────────────────────────────────────────
        btnSelect.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", () => {
            if (fileInput.files.length === 0) return;
            selectedFiles = Array.from(fileInput.files);
            refreshList();
            setStatus(`${selectedFiles.length} file(s) selected`);
            fileInput.value = "";           // allow re-selecting same files
        });

        // ── clear list ───────────────────────────────────────────────
        btnClear.addEventListener("click", () => {
            selectedFiles = [];
            refreshList();
            setStatus("Ready");
        });

        // ── merge ────────────────────────────────────────────────────
        btnMerge.addEventListener("click", async () => {
            if (selectedFiles.length === 0) {
                setStatus("Error: no files selected");
                return;
            }

            const filename = filenameIn.value.trim() || "combined_output.txt";
            setStatus("Merging...");

            try {
                const parts = [];

                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const header = (i === 0)
                        ? `--- [${file.name}] ---\n\n`
                        : `\n\n--- [${file.name}] ---\n\n`;

                    let content;
                    try {
                        content = await file.text();
                    } catch (err) {
                        content = `[Error: could not read — ${err.message}]`;
                    }

                    parts.push(header + content);
                }

                const blob = new Blob(parts, { type: "text/plain;charset=utf-8" });
                const url  = URL.createObjectURL(blob);

                const a    = document.createElement("a");
                a.href     = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);

                setStatus(`Success! → ${filename}`, true);
            } catch (err) {
                setStatus(`Error: ${err.message}`);
            }
        });
    </script>
</body>
</html>
