<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CombiFile</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #d4d4d4;
            display: flex;
            user-select: none;
        }

        /* ═══════════════════════════════════════════════════════════
           SIDEBAR
           ═══════════════════════════════════════════════════════════ */
        .sidebar {
            width: 272px;
            min-width: 272px;
            height: 100vh;
            background: #111111;
            border-right: 1px solid #1e1e1e;
            display: flex;
            flex-direction: column;
            padding: 20px 18px;
            gap: 6px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            color: #e8e8e8;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .sidebar-title span {
            color: #6b9cad;
        }

        .sidebar-section {
            margin-top: 10px;
            margin-bottom: 2px;
        }

        .sidebar-label {
            font-size: 10px;
            font-weight: 600;
            color: #444444;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        /* ── sidebar buttons ─────────────────────────────────────── */
        .sidebar-btn-row {
            display: flex;
            gap: 6px;
        }

        .sidebar button, .sidebar .s-btn {
            height: 32px;
            width: 100%;
            background: #1a1a1a;
            color: #b0b0b0;
            border: 1px solid #252525;
            border-radius: 5px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            padding: 0 12px;
            text-align: center;
        }

        .sidebar button:hover {
            background: #222222;
            border-color: #333333;
        }

        .sidebar .btn-dim {
            color: #666666;
        }

        .sidebar .btn-accent {
            background: #152228;
            border-color: #2a4a56;
            color: #8ec3d4;
            font-weight: 600;
            height: 36px;
            font-size: 13px;
        }

        .sidebar .btn-accent:hover {
            background: #1c3040;
            border-color: #3a6575;
        }

        /* ── sidebar inputs ──────────────────────────────────────── */
        .s-input {
            height: 32px;
            width: 100%;
            background: #141414;
            color: #cccccc;
            border: 1px solid #252525;
            border-radius: 5px;
            font-size: 12px;
            font-family: inherit;
            padding: 0 10px;
            outline: none;
            transition: border-color 0.15s;
        }

        .s-input:focus {
            border-color: #4a7a8a;
        }

        .s-input::placeholder {
            color: #3a3a3a;
        }

        .s-select {
            height: 32px;
            width: 100%;
            background: #141414;
            color: #aaaaaa;
            border: 1px solid #252525;
            border-radius: 5px;
            font-size: 12px;
            font-family: inherit;
            padding: 0 8px;
            cursor: pointer;
            outline: none;
        }

        .s-select:hover, .s-select:focus {
            border-color: #333333;
        }

        .input-row {
            display: flex;
            gap: 6px;
        }

        .input-row .s-input {
            flex: 1;
            min-width: 0;
        }

        .input-row button {
            width: auto;
            flex-shrink: 0;
            padding: 0 10px;
            font-size: 11px;
            color: #6b9cad;
            background: #131c20;
            border-color: #253035;
        }

        .input-row button:hover {
            background: #1a2a30;
            border-color: #3a5560;
        }

        .sidebar-divider {
            height: 1px;
            background: #1e1e1e;
            margin: 8px 0;
        }

        .sidebar-spacer {
            flex: 1;
        }

        /* ═══════════════════════════════════════════════════════════
           MAIN CONTENT
           ═══════════════════════════════════════════════════════════ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 0;
            position: relative;
        }

        /* drag and drop overlay */
        .drop-zone {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.9);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #8ec3d4;
            border: 2px dashed #2a4a56;
            margin: 10px;
            border-radius: 8px;
            pointer-events: none; /* crucial so it doesn't block dragleave */
        }

        .drop-zone.active {
            display: flex;
        }
        
        .drop-zone-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .drop-zone-text {
            font-size: 20px;
            font-weight: 600;
        }

        /* ── header bar ──────────────────────────────────────────── */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #1a1a1a;
            background: #0d0d0d;
            flex-shrink: 0;
        }

        .main-header-title {
            font-size: 13px;
            color: #555555;
        }

        .main-header-title b {
            color: #999999;
            font-weight: 600;
        }

        .main-header-count {
            font-size: 12px;
            color: #444444;
        }

        /* ── file list columns header ────────────────────────────── */
        .list-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            height: 36px;
            border-bottom: 1px solid #1a1a1a;
            background: #0c0c0c;
            flex-shrink: 0;
        }

        .list-header span {
            font-size: 10px;
            font-weight: 600;
            color: #3a3a3a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .lh-reorder { width: 14px; margin-right: 4px; }
        .lh-check { width: 20px; }
        .lh-name  { flex: 1; }
        .lh-ext   { width: 70px; text-align: center; }
        .lh-remove { width: 28px; }

        /* ── file list ───────────────────────────────────────────── */
        .file-list {
            flex: 1;
            overflow-y: auto;
            background: #0a0a0a;
        }

        .file-list-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #222222;
            font-size: 14px;
            pointer-events: none;
            flex-direction: column;
            gap: 6px;
        }

        .file-list-empty-sub {
            font-size: 11px;
            color: #1a1a1a;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            height: 40px;
            border-bottom: 1px solid #111111;
            transition: background 0.1s;
        }

        .file-item:hover {
            background: #121618;
        }

        .file-item.unchecked {
            opacity: 0.35;
        }

        .file-item.unchecked .file-name {
            text-decoration: line-through;
        }

        /* up / down reorder buttons */
        .file-reorder {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 14px;
            margin-right: 4px;
        }
        
        .file-reorder button {
            background: none;
            border: none;
            color: #555;
            font-size: 10px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 0;
        }
        
        .file-reorder button:hover {
            color: #fff;
        }
        
        .file-reorder button:disabled {
            color: #222;
            cursor: default;
        }

        /* checkbox */
        .file-check {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            min-width: 16px;
            background: #0e0e0e;
            border: 1px solid #333333;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: background 0.15s, border-color 0.15s;
        }

        .file-check:checked {
            background: #2a4a55;
            border-color: #5a8a9a;
        }

        .file-check:checked::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 1px;
            width: 5px;
            height: 9px;
            border: solid #c0dde6;
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(40deg);
        }

        .file-name {
            flex: 1;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 13px;
            color: #909090;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-ext {
            width: 70px;
            text-align: center;
            font-size: 10px;
            color: #4a6a75;
            background: #101a1e;
            padding: 2px 0;
            border-radius: 3px;
            font-family: Consolas, monospace;
        }

        .file-remove {
            background: none;
            border: none;
            color: #282828;
            font-size: 15px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.15s, background 0.15s;
            padding: 0;
        }

        .file-remove:hover {
            color: #aa5555;
            background: #1a1214;
        }

        /* ── status bar ──────────────────────────────────────────── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 36px;
            border-top: 1px solid #1a1a1a;
            background: #0d0d0d;
            flex-shrink: 0;
        }

        .status-text {
            font-size: 11px;
            color: #444444;
            transition: color 0.2s;
        }

        .status-text.success { color: #6b9cad; }
        .status-text.error   { color: #aa6666; }

        .status-info {
            font-size: 11px;
            color: #333333;
        }

        /* ── scrollbar ───────────────────────────────────────────── */
        .file-list::-webkit-scrollbar,
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .file-list::-webkit-scrollbar-track,
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .file-list::-webkit-scrollbar-thumb,
        .sidebar::-webkit-scrollbar-thumb {
            background: #1e1e1e;
            border-radius: 3px;
        }

        .file-list::-webkit-scrollbar-thumb:hover,
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #2e2e2e;
        }

        #file-input { display: none; }
        #folder-input { display: none; }
    </style>
</head>
<body>

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar">
        <div class="sidebar-title">Combi<span>File</span></div>

        <div class="sidebar-section">
            <div class="sidebar-label">Files</div>
        </div>
        <div class="sidebar-btn-row">
            <button id="btn-add" type="button">+ Add Files</button>
            <button id="btn-add-folder" type="button">+ Add Folder</button>
        </div>
        <button id="btn-clear" type="button" class="btn-dim" style="margin-top: 6px;">Clear All</button>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <div class="sidebar-label">Sort</div>
        </div>
        <select id="sort-select" class="s-select">
            <option value="none">As added / Custom</option>
            <option value="name-asc">Name A → Z</option>
            <option value="name-desc">Name Z → A</option>
            <option value="ext">Extension</option>
        </select>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <div class="sidebar-label">Select by name</div>
        </div>
        <div class="input-row">
            <input type="text" class="s-input" id="filter-name" placeholder="e.g. config" spellcheck="false" />
            <button type="button" id="btn-filter-name">Select</button>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-label">Select by extension</div>
        </div>
        <div class="input-row">
            <input type="text" class="s-input" id="filter-ext" placeholder="e.g. .cs" spellcheck="false" />
            <button type="button" id="btn-filter-ext">Select</button>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <div class="sidebar-label">Selection</div>
        </div>
        <div class="sidebar-btn-row">
            <button id="btn-check-all" type="button">All</button>
            <button id="btn-uncheck-all" type="button">None</button>
            <button id="btn-invert" type="button">Invert</button>
        </div>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <div class="sidebar-label">Separator</div>
        </div>
        <input
            type="text"
            class="s-input"
            id="separator-input"
            value="--- [{name}] ---"
            spellcheck="false"
            title="Use {name} for filename"
        />

        <div class="sidebar-section">
            <div class="sidebar-label">Output Filename</div>
        </div>
        <input
            type="text"
            class="s-input"
            id="filename-input"
            value="combined_output.txt"
            spellcheck="false"
        />
        <div class="sidebar-btn-row" style="margin-top: 8px;">
            <button id="btn-copy" type="button" class="btn-accent">Copy</button>
            <button id="btn-merge" type="button" class="btn-accent">Download</button>
        </div>
    </aside>

    <!-- ═══ MAIN ═══ -->
    <main class="main" id="main-area">
        <div class="drop-zone" id="drop-zone">
            <div class="drop-zone-icon">📥</div>
            <div class="drop-zone-text">Drop files or folders here</div>
        </div>
        
        <div class="main-header">
            <div class="main-header-title"><b>Files</b> — queued for merging</div>
            <div class="main-header-count" id="header-count"></div>
        </div>

        <div class="list-header">
            <span class="lh-reorder"></span>
            <span class="lh-check"></span>
            <span class="lh-name">Filename</span>
            <span class="lh-ext">Type</span>
            <span class="lh-remove"></span>
        </div>

        <div class="file-list" id="file-list">
            <div class="file-list-empty" id="empty-msg">
                No files added yet
                <div class="file-list-empty-sub">Click "Add Files" or drag & drop files here</div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-text" id="status">Ready</div>
            <div class="status-info" id="status-info"></div>
        </div>
    </main>

    <input type="file" id="file-input" multiple />
    <input type="file" id="folder-input" webkitdirectory directory multiple />

    <script>
        const fileInput     = document.getElementById("file-input");
        const folderInput   = document.getElementById("folder-input");
        const fileListEl    = document.getElementById("file-list");
        const emptyMsg      = document.getElementById("empty-msg");
        const filenameIn    = document.getElementById("filename-input");
        const separatorIn   = document.getElementById("separator-input");
        const statusEl      = document.getElementById("status");
        const statusInfoEl  = document.getElementById("status-info");
        const headerCountEl = document.getElementById("header-count");
        
        const btnAdd        = document.getElementById("btn-add");
        const btnAddFolder  = document.getElementById("btn-add-folder");
        const btnClear      = document.getElementById("btn-clear");
        const btnMerge      = document.getElementById("btn-merge");
        const btnCopy       = document.getElementById("btn-copy");
        
        const btnCheckAll   = document.getElementById("btn-check-all");
        const btnUncheckAll = document.getElementById("btn-uncheck-all");
        const btnInvert     = document.getElementById("btn-invert");
        
        const sortSelect    = document.getElementById("sort-select");
        const filterName    = document.getElementById("filter-name");
        const btnFilterName = document.getElementById("btn-filter-name");
        const filterExt     = document.getElementById("filter-ext");
        const btnFilterExt  = document.getElementById("btn-filter-ext");

        let entries    = [];
        let nextId     = 0;
        let resetTimer = null;

        // ── helpers ──────────────────────────────────────────────────
        function getExtension(name) {
            const dot = name.lastIndexOf(".");
            return dot > 0 ? name.slice(dot).toLowerCase() : "";
        }

        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = "status-text" + (type ? " " + type : "");
            if (resetTimer) clearTimeout(resetTimer);
            if (type === "success") {
                resetTimer = setTimeout(() => {
                    statusEl.textContent = "Ready";
                    statusEl.className = "status-text";
                }, 3000);
            }
        }

        function updateCounts() {
            const checked = entries.filter(e => e.checked).length;
            const total   = entries.length;
            headerCountEl.textContent = total > 0 ? `${checked} / ${total} selected` : "";
            statusInfoEl.textContent = total > 0 ? `${total} file(s) total` : "";
        }

        function getSortedEntries() {
            const sorted = [...entries];
            const mode = sortSelect.value;
            if (mode === "name-asc") {
                sorted.sort((a, b) => a.file.name.localeCompare(b.file.name));
            } else if (mode === "name-desc") {
                sorted.sort((a, b) => b.file.name.localeCompare(a.file.name));
            } else if (mode === "ext") {
                sorted.sort((a, b) => {
                    const ea = getExtension(a.file.name);
                    const eb = getExtension(b.file.name);
                    if (ea !== eb) return ea.localeCompare(eb);
                    return a.file.name.localeCompare(b.file.name);
                });
            }
            return sorted;
        }

        function isBinaryFile(file) {
            if (file.type.startsWith("image/") || 
                file.type.startsWith("video/") || 
                file.type.startsWith("audio/")) {
                return true;
            }
            const binaryExts = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".bmp", ".pdf", ".zip", ".tar", ".gz", ".rar", ".7z", ".exe", ".dll", ".so", ".dylib", ".mp4", ".mp3", ".wav"];
            const ext = getExtension(file.name);
            return binaryExts.includes(ext);
        }
        
        function moveEntry(id, direction) {
            if (sortSelect.value !== "none") {
                entries = getSortedEntries();
                sortSelect.value = "none";
            }
            const idx = entries.findIndex(e => e.id === id);
            if (direction === -1 && idx > 0) {
                [entries[idx], entries[idx-1]] = [entries[idx-1], entries[idx]];
            } else if (direction === 1 && idx < entries.length - 1) {
                [entries[idx], entries[idx+1]] = [entries[idx+1], entries[idx]];
            }
            renderList();
        }

        function renderList() {
            fileListEl.querySelectorAll(".file-item").forEach(el => el.remove());

            if (entries.length === 0) {
                emptyMsg.style.display = "flex";
                updateCounts();
                return;
            }

            emptyMsg.style.display = "none";
            const sorted = getSortedEntries();

            sorted.forEach((entry, i) => {
                const row = document.createElement("div");
                row.className = "file-item" + (entry.checked ? "" : " unchecked");
                
                // reorder buttons
                const reorder = document.createElement("div");
                reorder.className = "file-reorder";
                const btnUp = document.createElement("button");
                btnUp.innerHTML = "▲";
                btnUp.disabled = i === 0;
                btnUp.addEventListener("click", () => moveEntry(entry.id, -1));
                
                const btnDown = document.createElement("button");
                btnDown.innerHTML = "▼";
                btnDown.disabled = i === sorted.length - 1;
                btnDown.addEventListener("click", () => moveEntry(entry.id, 1));
                
                reorder.appendChild(btnUp);
                reorder.appendChild(btnDown);

                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.className = "file-check";
                cb.checked = entry.checked;
                cb.addEventListener("change", () => {
                    entry.checked = cb.checked;
                    row.classList.toggle("unchecked", !cb.checked);
                    updateCounts();
                });

                const name = document.createElement("span");
                name.className = "file-name";
                name.textContent = entry.file.webkitRelativePath || entry.file.name;
                name.title = entry.file.webkitRelativePath || entry.file.name;

                const ext = getExtension(entry.file.name);
                const extBadge = document.createElement("span");
                extBadge.className = "file-ext";
                extBadge.textContent = ext || "\u2014";

                const rm = document.createElement("button");
                rm.className = "file-remove";
                rm.innerHTML = "&#x2715;";
                rm.title = "Remove";
                rm.addEventListener("click", () => {
                    entries = entries.filter(e => e.id !== entry.id);
                    renderList();
                });

                row.appendChild(reorder);
                row.appendChild(cb);
                row.appendChild(name);
                row.appendChild(extBadge);
                row.appendChild(rm);
                fileListEl.appendChild(row);
            });

            updateCounts();
        }

        // ── add files / folders ──────────────────────────────────────
        btnAdd.addEventListener("click", () => fileInput.click());
        btnAddFolder.addEventListener("click", () => folderInput.click());

        function handleInputFiles(files) {
            if (files.length === 0) return;
            let added = 0;
            let skipped = 0;
            for (const f of files) {
                if (isBinaryFile(f)) {
                    skipped++;
                    continue;
                }
                entries.push({ id: nextId++, file: f, checked: true });
                added++;
            }
            renderList();
            if (skipped > 0) {
                setStatus(`Added ${added} file(s) (Skipped ${skipped} binary/image files)`, "success");
            } else {
                setStatus(`Added ${added} file(s)`, "success");
            }
        }

        fileInput.addEventListener("change", () => {
            handleInputFiles(fileInput.files);
            fileInput.value = "";
        });

        folderInput.addEventListener("change", () => {
            handleInputFiles(folderInput.files);
            folderInput.value = "";
        });

        // ── drag and drop ────────────────────────────────────────────
        const dropZone = document.getElementById("drop-zone");
        let dragCounter = 0;

        document.body.addEventListener("dragenter", e => {
            e.preventDefault();
            dragCounter++;
            dropZone.classList.add("active");
        });
        
        document.body.addEventListener("dragleave", e => {
            dragCounter--;
            if (dragCounter === 0) {
                dropZone.classList.remove("active");
            }
        });
        
        document.body.addEventListener("dragover", e => {
            e.preventDefault();
        });

        document.body.addEventListener("drop", e => {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove("active");

            if (e.dataTransfer.items) {
                const items = Array.from(e.dataTransfer.items);
                let added = 0;
                let skipped = 0;

                const processEntry = (entry) => {
                    return new Promise((resolve) => {
                        if (entry.isFile) {
                            entry.file(f => {
                                if (isBinaryFile(f)) {
                                    skipped++;
                                } else {
                                    entries.push({ id: nextId++, file: f, checked: true });
                                    added++;
                                }
                                resolve();
                            });
                        } else if (entry.isDirectory) {
                            const dirReader = entry.createReader();
                            dirReader.readEntries(async dirEntries => {
                                const p = [];
                                for (let i=0; i<dirEntries.length; i++) {
                                    p.push(processEntry(dirEntries[i]));
                                }
                                await Promise.all(p);
                                resolve();
                            });
                        } else {
                            resolve();
                        }
                    });
                };
                
                const allP = items.map(item => {
                    const entry = item.webkitGetAsEntry();
                    if (entry) return processEntry(entry);
                    return Promise.resolve();
                });
                
                Promise.all(allP).then(() => {
                    renderList();
                    if (skipped > 0) {
                        setStatus(`Added ${added} file(s) (Skipped ${skipped} binary/image files)`, "success");
                    } else {
                        setStatus(`Added ${added} file(s) via drag & drop`, "success");
                    }
                });
            } else {
                handleInputFiles(e.dataTransfer.files);
            }
        });


        // ── clear ────────────────────────────────────────────────────
        btnClear.addEventListener("click", () => {
            entries = [];
            nextId  = 0;
            filterName.value = "";
            filterExt.value  = "";
            renderList();
            setStatus("Ready");
        });

        // ── selection controls ───────────────────────────────────────
        btnCheckAll.addEventListener("click", () => {
            entries.forEach(e => e.checked = true);
            renderList();
        });

        btnUncheckAll.addEventListener("click", () => {
            entries.forEach(e => e.checked = false);
            renderList();
        });

        btnInvert.addEventListener("click", () => {
            entries.forEach(e => e.checked = !e.checked);
            renderList();
            setStatus("Selection inverted");
        });

        // ── sort ─────────────────────────────────────────────────────
        sortSelect.addEventListener("change", renderList);

        // ── filter by name ───────────────────────────────────────────
        function applyNameFilter() {
            const q = filterName.value.trim().toLowerCase();
            if (!q) return;
            entries.forEach(e => {
                e.checked = e.file.name.toLowerCase().includes(q);
            });
            renderList();
            const matched = entries.filter(e => e.checked).length;
            setStatus(`${matched} file(s) match "${filterName.value.trim()}"`);
        }

        btnFilterName.addEventListener("click", applyNameFilter);
        filterName.addEventListener("keydown", e => { if (e.key === "Enter") applyNameFilter(); });

        // ── filter by extension ──────────────────────────────────────
        function applyExtFilter() {
            let q = filterExt.value.trim().toLowerCase();
            if (!q) return;
            if (!q.startsWith(".")) q = "." + q;
            entries.forEach(e => {
                e.checked = getExtension(e.file.name) === q;
            });
            renderList();
            const matched = entries.filter(e => e.checked).length;
            setStatus(`${matched} file(s) with "${q}" extension`);
        }

        btnFilterExt.addEventListener("click", applyExtFilter);
        filterExt.addEventListener("keydown", e => { if (e.key === "Enter") applyExtFilter(); });

        // ── generate output ──────────────────────────────────────────
        async function generateOutput() {
            const toMerge = getSortedEntries().filter(e => e.checked);
            if (toMerge.length === 0) {
                setStatus("No files checked", "error");
                return null;
            }

            const sepPattern = separatorIn.value;
            const parts = [];

            for (let i = 0; i < toMerge.length; i++) {
                const file = toMerge[i].file;
                const relPath = file.webkitRelativePath || file.name;
                
                let header = sepPattern ? sepPattern.replace("{name}", relPath) : "";
                if (header) {
                    header = (i === 0) ? `${header}\n\n` : `\n\n${header}\n\n`;
                } else {
                    header = (i === 0) ? "" : "\n";
                }

                let content;
                try {
                    content = await file.text();
                } catch (err) {
                    content = `[Error: could not read \u2014 ${err.message}]`;
                }
                parts.push(header + content);
            }
            return { parts, count: toMerge.length };
        }

        // ── copy ─────────────────────────────────────────────────────
        btnCopy.addEventListener("click", async () => {
            setStatus("Generating output...");
            const result = await generateOutput();
            if (!result) return;
            
            try {
                const blob = new Blob(result.parts, { type: "text/plain;charset=utf-8" });
                const text = await blob.text();
                await navigator.clipboard.writeText(text);
                setStatus(`Copied ${result.count} files to clipboard`, "success");
            } catch(e) {
                setStatus(`Clipboard error: ${e.message}`, "error");
            }
        });

        // ── merge & download ─────────────────────────────────────────
        btnMerge.addEventListener("click", async () => {
             const filename = filenameIn.value.trim() || "combined_output.txt";
             setStatus("Generating output...");
             const result = await generateOutput();
             if (!result) return;

             try {
                const blob = new Blob(result.parts, { type: "text/plain;charset=utf-8" });
                const url  = URL.createObjectURL(blob);
                const a    = document.createElement("a");
                a.href     = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);

                setStatus(`Merged ${result.count} files \u2192 ${filename}`, "success");
             } catch(e) {
                setStatus(`Error: ${e.message}`, "error");
             }
        });
    </script>
</body>
</html>
