<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CombiFile</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0e0e0e;
            color: #d4d4d4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .app {
            width: 580px;
            background: #161616;
            border: 1px solid #252525;
            border-radius: 8px;
            padding: 20px 22px;
        }

        .app-title {
            font-size: 15px;
            font-weight: 600;
            color: #e8e8e8;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
        }

        .app-title span {
            color: #6b9cad;
        }

        /* ── buttons ─────────────────────────────────────────────── */
        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        button {
            height: 34px;
            background: #1e1e1e;
            color: #c0c0c0;
            border: 1px solid #2e2e2e;
            border-radius: 5px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            padding: 0 14px;
        }

        button:hover {
            background: #282828;
            border-color: #3a3a3a;
        }

        .btn-grow { flex: 1; }

        .btn-dim {
            color: #666666;
        }

        .btn-accent {
            background: #1a2a30;
            border-color: #2d4a55;
            color: #8ec3d4;
        }

        .btn-accent:hover {
            background: #223840;
            border-color: #3a6070;
        }

        .btn-full {
            width: 100%;
            margin-top: 12px;
        }

        /* ── toolbar (sort + filter) ─────────────────────────────── */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-label {
            font-size: 11px;
            color: #555555;
            white-space: nowrap;
        }

        select {
            height: 28px;
            background: #1a1a1a;
            color: #aaaaaa;
            border: 1px solid #2e2e2e;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            padding: 0 6px;
            cursor: pointer;
            outline: none;
        }

        select:hover, select:focus {
            border-color: #3a3a3a;
        }

        .filter-input {
            height: 28px;
            flex: 1;
            background: #1a1a1a;
            color: #cccccc;
            border: 1px solid #2e2e2e;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            padding: 0 8px;
            outline: none;
            min-width: 0;
        }

        .filter-input:focus {
            border-color: #4a7a8a;
        }

        .filter-input::placeholder {
            color: #444444;
        }

        .btn-filter {
            height: 28px;
            font-size: 11px;
            padding: 0 10px;
            color: #6b9cad;
            background: #161e22;
            border-color: #2a3a40;
            white-space: nowrap;
        }

        .btn-filter:hover {
            background: #1e2a30;
            border-color: #3a5560;
        }

        /* ── file list ───────────────────────────────────────────── */
        .file-list {
            width: 100%;
            height: 280px;
            background: #121212;
            border: 1px solid #252525;
            border-radius: 6px;
            overflow-y: auto;
            margin-bottom: 8px;
        }

        .file-list-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #2a2a2a;
            font-size: 13px;
            pointer-events: none;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            height: 34px;
            border-bottom: 1px solid #1a1a1a;
            transition: background 0.1s;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background: #1a1e20;
        }

        .file-item.unchecked {
            opacity: 0.4;
        }

        .file-item.unchecked .file-name {
            text-decoration: line-through;
        }

        /* checkbox */
        .file-check {
            appearance: none;
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            min-width: 15px;
            background: #0e0e0e;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: background 0.15s, border-color 0.15s;
        }

        .file-check:checked {
            background: #2a4a55;
            border-color: #5a8a9a;
        }

        .file-check:checked::after {
            content: "";
            position: absolute;
            left: 3.5px;
            top: 0.5px;
            width: 5px;
            height: 9px;
            border: solid #c0dde6;
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(40deg);
        }

        .file-name {
            flex: 1;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 12.5px;
            color: #909090;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-ext {
            font-size: 10px;
            color: #4a6a75;
            background: #141e22;
            padding: 1px 6px;
            border-radius: 3px;
            font-family: Consolas, monospace;
        }

        .file-remove {
            background: none;
            border: none;
            color: #333333;
            font-size: 14px;
            cursor: pointer;
            width: 22px;
            height: 22px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            transition: color 0.15s, background 0.15s;
            padding: 0;
        }

        .file-remove:hover {
            color: #aa5555;
            background: #1e1618;
        }

        /* ── list controls ───────────────────────────────────────── */
        .list-controls {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
        }

        .list-controls button {
            height: 24px;
            font-size: 11px;
            color: #555555;
            background: transparent;
            border: 1px solid #252525;
            padding: 0 10px;
        }

        .list-controls button:hover {
            color: #999999;
            background: #1a1a1a;
            border-color: #333333;
        }

        /* ── input ───────────────────────────────────────────────── */
        .field-label {
            font-size: 11px;
            color: #666666;
            margin-bottom: 3px;
            padding-left: 2px;
        }

        .filename-input {
            width: 100%;
            height: 34px;
            background: #121212;
            color: #d4d4d4;
            border: 1px solid #252525;
            border-radius: 5px;
            padding: 0 12px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }

        .filename-input:focus {
            border-color: #4a7a8a;
        }

        /* ── status ──────────────────────────────────────────────── */
        .status {
            font-size: 11px;
            color: #555555;
            margin-top: 8px;
            padding-left: 2px;
            height: 16px;
            transition: color 0.2s;
        }

        .status.success {
            color: #6b9cad;
        }

        .status.error {
            color: #aa6666;
        }

        /* ── scrollbar ───────────────────────────────────────────── */
        .file-list::-webkit-scrollbar {
            width: 6px;
        }

        .file-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .file-list::-webkit-scrollbar-thumb {
            background: #252525;
            border-radius: 3px;
        }

        .file-list::-webkit-scrollbar-thumb:hover {
            background: #353535;
        }

        #file-input { display: none; }
    </style>
</head>
<body>
    <div class="app">
        <div class="app-title">Combi<span>File</span></div>

        <div class="btn-row">
            <button id="btn-add" type="button" class="btn-grow">Add Files</button>
            <button id="btn-clear" type="button" class="btn-grow btn-dim">Clear All</button>
        </div>

        <!-- toolbar: sort + filter -->
        <div class="toolbar">
            <div class="toolbar-group">
                <span class="toolbar-label">Sort</span>
                <select id="sort-select">
                    <option value="none">As added</option>
                    <option value="name-asc">Name A → Z</option>
                    <option value="name-desc">Name Z → A</option>
                    <option value="ext">Extension</option>
                </select>
            </div>
            <input
                type="text"
                class="filter-input"
                id="filter-input"
                placeholder="Type to select matching files..."
                spellcheck="false"
            />
            <button type="button" class="btn-filter" id="btn-filter-apply">Select</button>
        </div>

        <div class="file-list" id="file-list">
            <div class="file-list-empty" id="empty-msg">No files selected</div>
        </div>

        <div class="list-controls">
            <button id="btn-check-all" type="button">Check All</button>
            <button id="btn-uncheck-all" type="button">Uncheck All</button>
        </div>

        <div class="field-label">Output filename</div>
        <input
            type="text"
            class="filename-input"
            id="filename-input"
            value="combined_output.txt"
            spellcheck="false"
        />

        <button id="btn-merge" type="button" class="btn-full btn-accent">Merge</button>
        <div class="status" id="status">Ready</div>

        <input type="file" id="file-input" multiple />
    </div>

    <script>
        const fileInput     = document.getElementById("file-input");
        const fileListEl    = document.getElementById("file-list");
        const emptyMsg      = document.getElementById("empty-msg");
        const filenameIn    = document.getElementById("filename-input");
        const statusEl      = document.getElementById("status");
        const btnAdd        = document.getElementById("btn-add");
        const btnClear      = document.getElementById("btn-clear");
        const btnMerge      = document.getElementById("btn-merge");
        const btnCheckAll   = document.getElementById("btn-check-all");
        const btnUncheckAll = document.getElementById("btn-uncheck-all");
        const sortSelect    = document.getElementById("sort-select");
        const filterInput   = document.getElementById("filter-input");
        const btnFilter     = document.getElementById("btn-filter-apply");

        /**
         * Each entry: { id, file: File, checked: boolean }
         */
        let entries    = [];
        let nextId     = 0;
        let resetTimer = null;

        // ── helpers ──────────────────────────────────────────────────

        function getExtension(name) {
            const dot = name.lastIndexOf(".");
            return dot > 0 ? name.slice(dot).toLowerCase() : "";
        }

        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = "status" + (type ? " " + type : "");
            if (resetTimer) clearTimeout(resetTimer);
            if (type === "success") {
                resetTimer = setTimeout(() => {
                    statusEl.textContent = "Ready";
                    statusEl.className = "status";
                }, 3000);
            }
        }

        function getSortedEntries() {
            const sorted = [...entries];
            const mode = sortSelect.value;
            if (mode === "name-asc") {
                sorted.sort((a, b) => a.file.name.localeCompare(b.file.name));
            } else if (mode === "name-desc") {
                sorted.sort((a, b) => b.file.name.localeCompare(a.file.name));
            } else if (mode === "ext") {
                sorted.sort((a, b) => {
                    const ea = getExtension(a.file.name);
                    const eb = getExtension(b.file.name);
                    if (ea !== eb) return ea.localeCompare(eb);
                    return a.file.name.localeCompare(b.file.name);
                });
            }
            return sorted;
        }

        function renderList() {
            fileListEl.querySelectorAll(".file-item").forEach(el => el.remove());

            if (entries.length === 0) {
                emptyMsg.style.display = "flex";
                return;
            }

            emptyMsg.style.display = "none";
            const sorted = getSortedEntries();

            sorted.forEach(entry => {
                const row = document.createElement("div");
                row.className = "file-item" + (entry.checked ? "" : " unchecked");

                // checkbox
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.className = "file-check";
                cb.checked = entry.checked;
                cb.addEventListener("change", () => {
                    entry.checked = cb.checked;
                    row.classList.toggle("unchecked", !cb.checked);
                    updateStatus();
                });

                // filename
                const name = document.createElement("span");
                name.className = "file-name";
                name.textContent = entry.file.name;
                name.title = entry.file.name;

                // extension badge
                const ext = getExtension(entry.file.name);
                const extBadge = document.createElement("span");
                extBadge.className = "file-ext";
                extBadge.textContent = ext || "—";

                // remove button
                const rm = document.createElement("button");
                rm.className = "file-remove";
                rm.innerHTML = "&#x2715;";
                rm.title = "Remove";
                rm.addEventListener("click", () => {
                    entries = entries.filter(e => e.id !== entry.id);
                    renderList();
                    updateStatus();
                });

                row.appendChild(cb);
                row.appendChild(name);
                row.appendChild(extBadge);
                row.appendChild(rm);
                fileListEl.appendChild(row);
            });
        }

        function updateStatus() {
            const checked = entries.filter(e => e.checked).length;
            const total   = entries.length;
            if (total === 0) {
                setStatus("Ready");
            } else {
                setStatus(`${checked} of ${total} file(s) checked`);
            }
        }

        // ── add files (appends) ──────────────────────────────────────
        btnAdd.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", () => {
            if (fileInput.files.length === 0) return;
            for (const f of fileInput.files) {
                entries.push({ id: nextId++, file: f, checked: true });
            }
            renderList();
            updateStatus();
            fileInput.value = "";
        });

        // ── clear all ────────────────────────────────────────────────
        btnClear.addEventListener("click", () => {
            entries = [];
            nextId  = 0;
            filterInput.value = "";
            renderList();
            setStatus("Ready");
        });

        // ── check / uncheck all ──────────────────────────────────────
        btnCheckAll.addEventListener("click", () => {
            entries.forEach(e => e.checked = true);
            renderList();
            updateStatus();
        });

        btnUncheckAll.addEventListener("click", () => {
            entries.forEach(e => e.checked = false);
            renderList();
            updateStatus();
        });

        // ── sort ─────────────────────────────────────────────────────
        sortSelect.addEventListener("change", () => {
            renderList();
        });

        // ── filter / select matching ─────────────────────────────────
        function applyFilter() {
            const query = filterInput.value.trim().toLowerCase();
            if (!query) return;

            entries.forEach(e => {
                e.checked = e.file.name.toLowerCase().includes(query);
            });
            renderList();

            const matched = entries.filter(e => e.checked).length;
            setStatus(`Selected ${matched} file(s) matching "${filterInput.value.trim()}"`);
        }

        btnFilter.addEventListener("click", applyFilter);
        filterInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") applyFilter();
        });

        // ── merge (only checked files, in display order) ─────────────
        btnMerge.addEventListener("click", async () => {
            const toMerge = getSortedEntries().filter(e => e.checked);

            if (toMerge.length === 0) {
                setStatus("No files checked", "error");
                return;
            }

            const filename = filenameIn.value.trim() || "combined_output.txt";
            setStatus("Merging...");

            try {
                const parts = [];

                for (let i = 0; i < toMerge.length; i++) {
                    const file = toMerge[i].file;
                    const header = (i === 0)
                        ? `--- [${file.name}] ---\n\n`
                        : `\n\n--- [${file.name}] ---\n\n`;

                    let content;
                    try {
                        content = await file.text();
                    } catch (err) {
                        content = `[Error: could not read \u2014 ${err.message}]`;
                    }

                    parts.push(header + content);
                }

                const blob = new Blob(parts, { type: "text/plain;charset=utf-8" });
                const url  = URL.createObjectURL(blob);

                const a    = document.createElement("a");
                a.href     = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);

                setStatus(`Merged ${toMerge.length} files \u2192 ${filename}`, "success");
            } catch (err) {
                setStatus(`Error: ${err.message}`, "error");
            }
        });
    </script>
</body>
</html>
