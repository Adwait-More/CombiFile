<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CombiFile</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #111111;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .app {
            width: 480px;
            padding: 14px;
        }

        /* ── buttons ─────────────────────────────────────────────── */
        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        button {
            flex: 1;
            height: 32px;
            background: #222222;
            color: #e0e0e0;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover {
            background: #2e2e2e;
        }

        .btn-dim {
            color: #777777;
        }

        .btn-full {
            flex: none;
            width: 100%;
            margin-top: 10px;
        }

        /* ── file list ───────────────────────────────────────────── */
        .file-list {
            width: 100%;
            height: 240px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .file-list-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #333333;
            font-size: 12px;
            pointer-events: none;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            height: 30px;
            border-bottom: 1px solid #1f1f1f;
            transition: background 0.1s;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background: #222222;
        }

        .file-item.unchecked .file-name {
            color: #444444;
            text-decoration: line-through;
        }

        /* checkbox */
        .file-check {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            min-width: 14px;
            background: #111111;
            border: 1px solid #3a3a3a;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            transition: background 0.15s, border-color 0.15s;
        }

        .file-check:checked {
            background: #444444;
            border-color: #555555;
        }

        .file-check:checked::after {
            content: "";
            position: absolute;
            left: 3px;
            top: 0px;
            width: 5px;
            height: 9px;
            border: solid #e0e0e0;
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(40deg);
        }

        .file-name {
            flex: 1;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 12px;
            color: #999999;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-remove {
            background: none;
            border: none;
            color: #444444;
            font-size: 15px;
            cursor: pointer;
            width: 20px;
            height: 20px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            transition: color 0.15s, background 0.15s;
        }

        .file-remove:hover {
            color: #999999;
            background: #2a2a2a;
        }

        /* ── controls below list ─────────────────────────────────── */
        .list-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .list-controls button {
            height: 24px;
            font-size: 11px;
            color: #555555;
            background: transparent;
            border: 1px solid #2a2a2a;
        }

        .list-controls button:hover {
            color: #999999;
            background: #1a1a1a;
        }

        /* ── input ───────────────────────────────────────────────── */
        .field-label {
            font-size: 11px;
            color: #777777;
            margin-bottom: 2px;
            padding-left: 2px;
        }

        .filename-input {
            width: 100%;
            height: 32px;
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 0 10px;
            font-size: 13px;
            outline: none;
        }

        .filename-input:focus {
            border-color: #3a3a3a;
        }

        /* ── status ──────────────────────────────────────────────── */
        .status {
            font-size: 11px;
            color: #777777;
            margin-top: 6px;
            padding-left: 2px;
            height: 16px;
        }

        /* ── scrollbar ───────────────────────────────────────────── */
        .file-list::-webkit-scrollbar {
            width: 6px;
        }

        .file-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .file-list::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }

        .file-list::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        #file-input { display: none; }
    </style>
</head>
<body>
    <div class="app">
        <div class="btn-row">
            <button id="btn-add" type="button">Add Files</button>
            <button id="btn-clear" type="button" class="btn-dim">Clear All</button>
        </div>

        <div class="file-list" id="file-list">
            <div class="file-list-empty" id="empty-msg">No files selected</div>
        </div>

        <div class="list-controls">
            <button id="btn-check-all" type="button">Check All</button>
            <button id="btn-uncheck-all" type="button">Uncheck All</button>
        </div>

        <div class="field-label">Output filename</div>
        <input
            type="text"
            class="filename-input"
            id="filename-input"
            value="combined_output.txt"
            spellcheck="false"
        />

        <button id="btn-merge" type="button" class="btn-full">Merge</button>
        <div class="status" id="status">Ready</div>

        <input type="file" id="file-input" multiple />
    </div>

    <script>
        const fileInput  = document.getElementById("file-input");
        const fileListEl = document.getElementById("file-list");
        const emptyMsg   = document.getElementById("empty-msg");
        const filenameIn = document.getElementById("filename-input");
        const statusEl   = document.getElementById("status");
        const btnAdd     = document.getElementById("btn-add");
        const btnClear   = document.getElementById("btn-clear");
        const btnMerge   = document.getElementById("btn-merge");
        const btnCheckAll   = document.getElementById("btn-check-all");
        const btnUncheckAll = document.getElementById("btn-uncheck-all");

        /**
         * Each entry: { id, file: File, checked: boolean }
         * Using a unique id per entry so we can remove by reference.
         */
        let entries  = [];
        let nextId   = 0;
        let resetTimer = null;

        // ── helpers ──────────────────────────────────────────────────
        function setStatus(text, autoReset = false) {
            statusEl.textContent = text;
            if (resetTimer) clearTimeout(resetTimer);
            if (autoReset) {
                resetTimer = setTimeout(() => { statusEl.textContent = "Ready"; }, 3000);
            }
        }

        function renderList() {
            // remove all file-item elements (keep empty-msg)
            fileListEl.querySelectorAll(".file-item").forEach(el => el.remove());

            if (entries.length === 0) {
                emptyMsg.style.display = "flex";
                return;
            }

            emptyMsg.style.display = "none";

            entries.forEach(entry => {
                const row = document.createElement("div");
                row.className = "file-item" + (entry.checked ? "" : " unchecked");
                row.dataset.id = entry.id;

                // checkbox
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.className = "file-check";
                cb.checked = entry.checked;
                cb.addEventListener("change", () => {
                    entry.checked = cb.checked;
                    row.classList.toggle("unchecked", !cb.checked);
                    updateStatus();
                });

                // filename
                const name = document.createElement("span");
                name.className = "file-name";
                name.textContent = entry.file.name;
                name.title = entry.file.name;

                // remove button
                const rm = document.createElement("button");
                rm.className = "file-remove";
                rm.innerHTML = "&#x2715;";
                rm.title = "Remove";
                rm.addEventListener("click", () => {
                    entries = entries.filter(e => e.id !== entry.id);
                    renderList();
                    updateStatus();
                });

                row.appendChild(cb);
                row.appendChild(name);
                row.appendChild(rm);
                fileListEl.appendChild(row);
            });
        }

        function updateStatus() {
            const checked = entries.filter(e => e.checked).length;
            const total   = entries.length;
            if (total === 0) {
                setStatus("Ready");
            } else {
                setStatus(`${checked}/${total} file(s) checked`);
            }
        }

        // ── add files (appends, doesn't replace) ─────────────────────
        btnAdd.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", () => {
            if (fileInput.files.length === 0) return;
            for (const f of fileInput.files) {
                entries.push({ id: nextId++, file: f, checked: true });
            }
            renderList();
            updateStatus();
            fileInput.value = "";
        });

        // ── clear all ────────────────────────────────────────────────
        btnClear.addEventListener("click", () => {
            entries = [];
            nextId  = 0;
            renderList();
            setStatus("Ready");
        });

        // ── check / uncheck all ──────────────────────────────────────
        btnCheckAll.addEventListener("click", () => {
            entries.forEach(e => e.checked = true);
            renderList();
            updateStatus();
        });

        btnUncheckAll.addEventListener("click", () => {
            entries.forEach(e => e.checked = false);
            renderList();
            updateStatus();
        });

        // ── merge (only checked files) ───────────────────────────────
        btnMerge.addEventListener("click", async () => {
            const toMerge = entries.filter(e => e.checked);

            if (toMerge.length === 0) {
                setStatus("Error: no files checked");
                return;
            }

            const filename = filenameIn.value.trim() || "combined_output.txt";
            setStatus("Merging...");

            try {
                const parts = [];

                for (let i = 0; i < toMerge.length; i++) {
                    const file = toMerge[i].file;
                    const header = (i === 0)
                        ? `--- [${file.name}] ---\n\n`
                        : `\n\n--- [${file.name}] ---\n\n`;

                    let content;
                    try {
                        content = await file.text();
                    } catch (err) {
                        content = `[Error: could not read \u2014 ${err.message}]`;
                    }

                    parts.push(header + content);
                }

                const blob = new Blob(parts, { type: "text/plain;charset=utf-8" });
                const url  = URL.createObjectURL(blob);

                const a    = document.createElement("a");
                a.href     = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);

                setStatus(`Success! \u2192 ${filename}`, true);
            } catch (err) {
                setStatus(`Error: ${err.message}`);
            }
        });
    </script>
</body>
</html>
