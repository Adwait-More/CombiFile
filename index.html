<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CombiFile</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #d4d4d4;
            display: flex;
            user-select: none;
        }

        /* ═══════════════════════════════════════════════════════════
           SIDEBAR
           ═══════════════════════════════════════════════════════════ */
        .sidebar {
            width: 272px;
            min-width: 272px;
            height: 100vh;
            background: #111111;
            border-right: 1px solid #1e1e1e;
            display: flex;
            flex-direction: column;
            padding: 20px 18px;
            gap: 6px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            color: #e8e8e8;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .sidebar-title span {
            color: #6b9cad;
        }

        .sidebar-section {
            margin-top: 10px;
            margin-bottom: 2px;
        }

        .sidebar-label {
            font-size: 10px;
            font-weight: 600;
            color: #444444;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        /* ── sidebar buttons ─────────────────────────────────────── */
        .sidebar-btn-row {
            display: flex;
            gap: 6px;
        }

        .sidebar button, .sidebar .s-btn {
            height: 32px;
            width: 100%;
            background: #1a1a1a;
            color: #b0b0b0;
            border: 1px solid #252525;
            border-radius: 5px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            padding: 0 12px;
            text-align: center;
        }

        .sidebar button:hover {
            background: #222222;
            border-color: #333333;
        }

        .sidebar .btn-dim {
            color: #666666;
        }

        .sidebar .btn-accent {
            background: #152228;
            border-color: #2a4a56;
            color: #8ec3d4;
            font-weight: 600;
            height: 36px;
            font-size: 13px;
        }

        .sidebar .btn-accent:hover {
            background: #1c3040;
            border-color: #3a6575;
        }

        /* ── sidebar inputs ──────────────────────────────────────── */
        .s-input {
            height: 32px;
            width: 100%;
            background: #141414;
            color: #cccccc;
            border: 1px solid #252525;
            border-radius: 5px;
            font-size: 12px;
            font-family: inherit;
            padding: 0 10px;
            outline: none;
            transition: border-color 0.15s;
        }

        .s-input:focus {
            border-color: #4a7a8a;
        }

        .s-input::placeholder {
            color: #3a3a3a;
        }

        .s-select {
            height: 32px;
            width: 100%;
            background: #141414;
            color: #aaaaaa;
            border: 1px solid #252525;
            border-radius: 5px;
            font-size: 12px;
            font-family: inherit;
            padding: 0 8px;
            cursor: pointer;
            outline: none;
        }

        .s-select:hover, .s-select:focus {
            border-color: #333333;
        }

        .input-row {
            display: flex;
            gap: 6px;
        }

        .input-row .s-input {
            flex: 1;
            min-width: 0;
        }

        .input-row button {
            width: auto;
            flex-shrink: 0;
            padding: 0 10px;
            font-size: 11px;
            color: #6b9cad;
            background: #131c20;
            border-color: #253035;
        }

        .input-row button:hover {
            background: #1a2a30;
            border-color: #3a5560;
        }

        .sidebar-divider {
            height: 1px;
            background: #1e1e1e;
            margin: 8px 0;
        }

        .sidebar-spacer {
            flex: 1;
        }

        /* ═══════════════════════════════════════════════════════════
           MAIN CONTENT
           ═══════════════════════════════════════════════════════════ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            min-width: 0;
        }

        /* ── header bar ──────────────────────────────────────────── */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #1a1a1a;
            background: #0d0d0d;
            flex-shrink: 0;
        }

        .main-header-title {
            font-size: 13px;
            color: #555555;
        }

        .main-header-title b {
            color: #999999;
            font-weight: 600;
        }

        .main-header-count {
            font-size: 12px;
            color: #444444;
        }

        /* ── file list columns header ────────────────────────────── */
        .list-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            height: 36px;
            border-bottom: 1px solid #1a1a1a;
            background: #0c0c0c;
            flex-shrink: 0;
        }

        .list-header span {
            font-size: 10px;
            font-weight: 600;
            color: #3a3a3a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .lh-check { width: 20px; }
        .lh-name  { flex: 1; }
        .lh-ext   { width: 70px; text-align: center; }
        .lh-remove { width: 28px; }

        /* ── file list ───────────────────────────────────────────── */
        .file-list {
            flex: 1;
            overflow-y: auto;
            background: #0a0a0a;
        }

        .file-list-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #222222;
            font-size: 14px;
            pointer-events: none;
            flex-direction: column;
            gap: 6px;
        }

        .file-list-empty-sub {
            font-size: 11px;
            color: #1a1a1a;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            height: 40px;
            border-bottom: 1px solid #111111;
            transition: background 0.1s;
        }

        .file-item:hover {
            background: #121618;
        }

        .file-item.unchecked {
            opacity: 0.35;
        }

        .file-item.unchecked .file-name {
            text-decoration: line-through;
        }

        /* checkbox */
        .file-check {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            min-width: 16px;
            background: #0e0e0e;
            border: 1px solid #333333;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: background 0.15s, border-color 0.15s;
        }

        .file-check:checked {
            background: #2a4a55;
            border-color: #5a8a9a;
        }

        .file-check:checked::after {
            content: "";
            position: absolute;
            left: 4px;
            top: 1px;
            width: 5px;
            height: 9px;
            border: solid #c0dde6;
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(40deg);
        }

        .file-name {
            flex: 1;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 13px;
            color: #909090;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-ext {
            width: 70px;
            text-align: center;
            font-size: 10px;
            color: #4a6a75;
            background: #101a1e;
            padding: 2px 0;
            border-radius: 3px;
            font-family: Consolas, monospace;
        }

        .file-remove {
            background: none;
            border: none;
            color: #282828;
            font-size: 15px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.15s, background 0.15s;
            padding: 0;
        }

        .file-remove:hover {
            color: #aa5555;
            background: #1a1214;
        }

        /* ── status bar ──────────────────────────────────────────── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 36px;
            border-top: 1px solid #1a1a1a;
            background: #0d0d0d;
            flex-shrink: 0;
        }

        .status-text {
            font-size: 11px;
            color: #444444;
            transition: color 0.2s;
        }

        .status-text.success { color: #6b9cad; }
        .status-text.error   { color: #aa6666; }

        .status-info {
            font-size: 11px;
            color: #333333;
        }

        /* ── scrollbar ───────────────────────────────────────────── */
        .file-list::-webkit-scrollbar,
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .file-list::-webkit-scrollbar-track,
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .file-list::-webkit-scrollbar-thumb,
        .sidebar::-webkit-scrollbar-thumb {
            background: #1e1e1e;
            border-radius: 3px;
        }

        .file-list::-webkit-scrollbar-thumb:hover,
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #2e2e2e;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="sidebar">
        <div class="sidebar-title">Combi<span>File</span></div>

        <div class="sidebar-section">
            <div class="sidebar-label">Files</div>
        </div>
        <button id="btn-add" type="button">+ Add Files</button>
        <button id="btn-clear" type="button" class="btn-dim">Clear All</button>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <div class="sidebar-label">Sort</div>
        </div>
        <select id="sort-select" class="s-select">
            <option value="none">As added</option>
            <option value="name-asc">Name A → Z</option>
            <option value="name-desc">Name Z → A</option>
            <option value="ext">Extension</option>
        </select>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <div class="sidebar-label">Select by name</div>
        </div>
        <div class="input-row">
            <input type="text" class="s-input" id="filter-name" placeholder="e.g. config" spellcheck="false" />
            <button type="button" id="btn-filter-name">Select</button>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-label">Select by extension</div>
        </div>
        <div class="input-row">
            <input type="text" class="s-input" id="filter-ext" placeholder="e.g. .cs" spellcheck="false" />
            <button type="button" id="btn-filter-ext">Select</button>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <div class="sidebar-label">Selection</div>
        </div>
        <div class="sidebar-btn-row">
            <button id="btn-check-all" type="button">All</button>
            <button id="btn-uncheck-all" type="button">None</button>
            <button id="btn-invert" type="button">Invert</button>
        </div>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <div class="sidebar-label">Output</div>
        </div>
        <input
            type="text"
            class="s-input"
            id="filename-input"
            value="combined_output.txt"
            spellcheck="false"
        />
        <button id="btn-merge" type="button" class="btn-accent">Merge & Download</button>
    </aside>

    <!-- ═══ MAIN ═══ -->
    <main class="main">
        <div class="main-header">
            <div class="main-header-title"><b>Files</b> — queued for merging</div>
            <div class="main-header-count" id="header-count"></div>
        </div>

        <div class="list-header">
            <span class="lh-check"></span>
            <span class="lh-name">Filename</span>
            <span class="lh-ext">Type</span>
            <span class="lh-remove"></span>
        </div>

        <div class="file-list" id="file-list">
            <div class="file-list-empty" id="empty-msg">
                No files added yet
                <div class="file-list-empty-sub">Click "Add Files" in the sidebar to get started</div>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-text" id="status">Ready</div>
            <div class="status-info" id="status-info"></div>
        </div>
    </main>

    <input type="file" id="file-input" multiple />

    <script>
        const fileInput     = document.getElementById("file-input");
        const fileListEl    = document.getElementById("file-list");
        const emptyMsg      = document.getElementById("empty-msg");
        const filenameIn    = document.getElementById("filename-input");
        const statusEl      = document.getElementById("status");
        const statusInfoEl  = document.getElementById("status-info");
        const headerCountEl = document.getElementById("header-count");
        const btnAdd        = document.getElementById("btn-add");
        const btnClear      = document.getElementById("btn-clear");
        const btnMerge      = document.getElementById("btn-merge");
        const btnCheckAll   = document.getElementById("btn-check-all");
        const btnUncheckAll = document.getElementById("btn-uncheck-all");
        const btnInvert     = document.getElementById("btn-invert");
        const sortSelect    = document.getElementById("sort-select");
        const filterName    = document.getElementById("filter-name");
        const btnFilterName = document.getElementById("btn-filter-name");
        const filterExt     = document.getElementById("filter-ext");
        const btnFilterExt  = document.getElementById("btn-filter-ext");

        let entries    = [];
        let nextId     = 0;
        let resetTimer = null;

        // ── helpers ──────────────────────────────────────────────────
        function getExtension(name) {
            const dot = name.lastIndexOf(".");
            return dot > 0 ? name.slice(dot).toLowerCase() : "";
        }

        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = "status-text" + (type ? " " + type : "");
            if (resetTimer) clearTimeout(resetTimer);
            if (type === "success") {
                resetTimer = setTimeout(() => {
                    statusEl.textContent = "Ready";
                    statusEl.className = "status-text";
                }, 3000);
            }
        }

        function updateCounts() {
            const checked = entries.filter(e => e.checked).length;
            const total   = entries.length;
            headerCountEl.textContent = total > 0 ? `${checked} / ${total} selected` : "";
            statusInfoEl.textContent = total > 0 ? `${total} file(s) total` : "";
        }

        function getSortedEntries() {
            const sorted = [...entries];
            const mode = sortSelect.value;
            if (mode === "name-asc") {
                sorted.sort((a, b) => a.file.name.localeCompare(b.file.name));
            } else if (mode === "name-desc") {
                sorted.sort((a, b) => b.file.name.localeCompare(a.file.name));
            } else if (mode === "ext") {
                sorted.sort((a, b) => {
                    const ea = getExtension(a.file.name);
                    const eb = getExtension(b.file.name);
                    if (ea !== eb) return ea.localeCompare(eb);
                    return a.file.name.localeCompare(b.file.name);
                });
            }
            return sorted;
        }

        function renderList() {
            fileListEl.querySelectorAll(".file-item").forEach(el => el.remove());

            if (entries.length === 0) {
                emptyMsg.style.display = "flex";
                updateCounts();
                return;
            }

            emptyMsg.style.display = "none";
            const sorted = getSortedEntries();

            sorted.forEach(entry => {
                const row = document.createElement("div");
                row.className = "file-item" + (entry.checked ? "" : " unchecked");

                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.className = "file-check";
                cb.checked = entry.checked;
                cb.addEventListener("change", () => {
                    entry.checked = cb.checked;
                    row.classList.toggle("unchecked", !cb.checked);
                    updateCounts();
                });

                const name = document.createElement("span");
                name.className = "file-name";
                name.textContent = entry.file.name;
                name.title = entry.file.name;

                const ext = getExtension(entry.file.name);
                const extBadge = document.createElement("span");
                extBadge.className = "file-ext";
                extBadge.textContent = ext || "\u2014";

                const rm = document.createElement("button");
                rm.className = "file-remove";
                rm.innerHTML = "&#x2715;";
                rm.title = "Remove";
                rm.addEventListener("click", () => {
                    entries = entries.filter(e => e.id !== entry.id);
                    renderList();
                });

                row.appendChild(cb);
                row.appendChild(name);
                row.appendChild(extBadge);
                row.appendChild(rm);
                fileListEl.appendChild(row);
            });

            updateCounts();
        }

        // ── add files ────────────────────────────────────────────────
        btnAdd.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", () => {
            if (fileInput.files.length === 0) return;
            for (const f of fileInput.files) {
                entries.push({ id: nextId++, file: f, checked: true });
            }
            renderList();
            setStatus(`Added ${fileInput.files.length} file(s)`);
            fileInput.value = "";
        });

        // ── clear ────────────────────────────────────────────────────
        btnClear.addEventListener("click", () => {
            entries = [];
            nextId  = 0;
            filterName.value = "";
            filterExt.value  = "";
            renderList();
            setStatus("Ready");
        });

        // ── selection controls ───────────────────────────────────────
        btnCheckAll.addEventListener("click", () => {
            entries.forEach(e => e.checked = true);
            renderList();
        });

        btnUncheckAll.addEventListener("click", () => {
            entries.forEach(e => e.checked = false);
            renderList();
        });

        btnInvert.addEventListener("click", () => {
            entries.forEach(e => e.checked = !e.checked);
            renderList();
            setStatus("Selection inverted");
        });

        // ── sort ─────────────────────────────────────────────────────
        sortSelect.addEventListener("change", renderList);

        // ── filter by name ───────────────────────────────────────────
        function applyNameFilter() {
            const q = filterName.value.trim().toLowerCase();
            if (!q) return;
            entries.forEach(e => {
                e.checked = e.file.name.toLowerCase().includes(q);
            });
            renderList();
            const matched = entries.filter(e => e.checked).length;
            setStatus(`${matched} file(s) match "${filterName.value.trim()}"`);
        }

        btnFilterName.addEventListener("click", applyNameFilter);
        filterName.addEventListener("keydown", e => { if (e.key === "Enter") applyNameFilter(); });

        // ── filter by extension ──────────────────────────────────────
        function applyExtFilter() {
            let q = filterExt.value.trim().toLowerCase();
            if (!q) return;
            if (!q.startsWith(".")) q = "." + q;
            entries.forEach(e => {
                e.checked = getExtension(e.file.name) === q;
            });
            renderList();
            const matched = entries.filter(e => e.checked).length;
            setStatus(`${matched} file(s) with "${q}" extension`);
        }

        btnFilterExt.addEventListener("click", applyExtFilter);
        filterExt.addEventListener("keydown", e => { if (e.key === "Enter") applyExtFilter(); });

        // ── merge ────────────────────────────────────────────────────
        btnMerge.addEventListener("click", async () => {
            const toMerge = getSortedEntries().filter(e => e.checked);

            if (toMerge.length === 0) {
                setStatus("No files checked", "error");
                return;
            }

            const filename = filenameIn.value.trim() || "combined_output.txt";
            setStatus("Merging...");

            try {
                const parts = [];

                for (let i = 0; i < toMerge.length; i++) {
                    const file = toMerge[i].file;
                    const header = (i === 0)
                        ? `--- [${file.name}] ---\n\n`
                        : `\n\n--- [${file.name}] ---\n\n`;

                    let content;
                    try {
                        content = await file.text();
                    } catch (err) {
                        content = `[Error: could not read \u2014 ${err.message}]`;
                    }
                    parts.push(header + content);
                }

                const blob = new Blob(parts, { type: "text/plain;charset=utf-8" });
                const url  = URL.createObjectURL(blob);
                const a    = document.createElement("a");
                a.href     = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);

                setStatus(`Merged ${toMerge.length} files \u2192 ${filename}`, "success");
            } catch (err) {
                setStatus(`Error: ${err.message}`, "error");
            }
        });
    </script>
</body>
</html>
